<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Subroutine</title>
<link rel="icon" href="/app/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/app/app.css">
<!--
	An import map rather than a build step. Every bare specifier any served module imports
	has to be here — including `preact`, which the minified `preact-hooks.js` asks for
	itself — because nothing rewrites these files on the way to the browser. That is the
	whole of why no bundler is needed, and the whole of what this map has to get right:
	a specifier with no entry is a module that never loads and a page that is simply blank.

	`tests/test_web.py` derives the answer from the modules rather than trusting this
	comment. It did not, once, and `htm` was missing.
-->
<script type="importmap">
{"imports": {"preact": "/app/preact.js", "preact/hooks": "/app/preact-hooks.js", "htm": "/app/htm.js"}}
</script>
<!--
	The reader's theme, applied before the first paint rather than when the app mounts.

	Deliberately not a module and deliberately not deferred: this has to run while the parser
	is still in the head, because the alternative is a flash of the wrong theme on every load
	for anybody who pinned one against their system. That is the whole reason it is here and
	not in `app.js`.

	**Nothing set means `system`**, which is the default and leaves `prefers-color-scheme` in
	force — so this writes an attribute only for the two states that override it, and an
	unrecognised value is ignored rather than trusted. Storage throws in some privacy modes, so
	a failure here leaves the page on the system theme rather than blank.

	`#805`'s policy covers this by construction: `policy.inline_script_hashes` derives a hash
	from every inline script in the served bytes, so there is no hash to keep in step. That was
	checked rather than assumed, and is recorded on `#908`.
-->
<script>
	try {
		var chosen = localStorage.getItem("theme");
		if (chosen === "light" || chosen === "dark") {
			document.documentElement.dataset.theme = chosen;
		}
	} catch (unavailable) {
		/* No storage, so no stored choice: the system's answer stands. */
	}
</script>
</head>
<body>
<noscript>
	<div class="empty">
		<p>This page needs JavaScript. Everything it shows is also available from the
		command line with <code>subroutine list</code>, and over HTTP at
		<code>/v1/tasks</code>.</p>
	</div>
</noscript>
<div id="app"></div>
<script type="module" src="/app/app.js"></script>
</body>
</html>
