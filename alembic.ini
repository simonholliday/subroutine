# Alembic configuration. The database URL is deliberately absent: it is resolved at
# runtime from Subroutine's own settings (env, config file, then default), so that
# `subroutine db upgrade` and `alembic upgrade` cannot disagree about which database
# they are talking to.
[alembic]
script_location = src/subroutine/db/migrations
prepend_sys_path = src
path_separator = os
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
