<!--
	The browser tab's mark — item `#644`.

	One file, no `.ico`: every browser that matters has taken an SVG favicon for years, and a
	multi-resolution bitmap would be a build step in a project whose whole web design decision
	was not to have one. A browser too old for this shows nothing, which is what it showed
	before.

	Drawn at 32 and legible at 16, which is the only size that really matters — so it is one
	shape and one tick, with no detail to lose. The blue is `--accent`'s light value rather
	than a token, because a favicon is composited by the browser's chrome and never sees this
	page's stylesheet.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
	<rect width="32" height="32" rx="7" fill="#2563eb"/>
	<path d="M9 16.5 L14 21.5 L23 11"
		fill="none" stroke="#ffffff" stroke-width="3.5"
		stroke-linecap="round" stroke-linejoin="round"/>
</svg>
