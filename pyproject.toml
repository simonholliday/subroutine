[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "subroutine"

# Derived from the git tag, never written here (`#234`). `v0.1.1` builds `0.1.1`; anything
# further along builds a `.devN+g<sha>` version, which PyPI refuses — so an untagged commit
# cannot be published even by accident. `subroutine.__version__` already read this back
# through `importlib.metadata`, so nothing at runtime changed.
#
# **The cost is that a shallow clone lies rather than fails.** Without tags the backend warns
# and produces `0.1.dev1+g…`, so every workflow job that installs this package checks out with
# `fetch-depth: 0`.
dynamic = ["version"]
description = "Agent-native task management for your life, your projects and your team."
readme = "README.md"
requires-python = ">=3.11"
license = "FSL-1.1-ALv2"
license-files = ["LICENSE"]
authors = [{ name = "Simon Holliday", email = "simon.holliday@protonmail.com" }]
keywords = ["project-management", "tasks", "agents", "ai", "self-hosted", "cli"]
classifiers = [
	"Development Status :: 3 - Alpha",
	"Environment :: Console",
	"Framework :: FastAPI",
	"Intended Audience :: Developers",
	# **What has actually been run, not what ought to work** (`#245`). This said
	# `OS Independent` while every CI job in both workflows ran `ubuntu-latest` — ten of them,
	# no exceptions — so PyPI advertised a portability nothing had ever demonstrated. Nobody
	# was misled into a failing install, which is why it was not a release blocker on its own;
	# it was a claim nothing checked, which is the shape of most of what has gone wrong here.
	#
	# `tests/test_packaging.py` holds this to the CI matrix, so widening the claim is done by
	# running the suite somewhere and letting the guard notice — never by editing this list.
	"Operating System :: POSIX :: Linux",
	"Programming Language :: Python :: 3.11",
	"Programming Language :: Python :: 3.12",
	"Programming Language :: Python :: 3.13",
	"Topic :: Office/Business :: Scheduling",
	"Typing :: Typed",
]

dependencies = [
	"alembic>=1.13",
	"argon2-cffi>=23.1",
	"fastapi>=0.115",
	"httpx>=0.27",
	"pydantic>=2.7",
	"pydantic-settings>=2.3",
	"python-dateutil>=2.9",
	"rich>=13.7",
	"sqlalchemy>=2.0.30",
	"typer>=0.12",
	"tzdata>=2024.1",
	"uuid6>=2024.7",
	"uvicorn[standard]>=0.30",
]

[tool.hatch.version]
source = "vcs"

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = [
	"hypothesis>=6.100",
	"mypy>=1.10",
	"pytest>=8.2",
	"pytest-cov>=5.0",
	# Reading the plugin skill's YAML frontmatter, which nothing parsed until a colon in it
	# made the skill load with no metadata at all and 2,391 tests passed over it.
	"pyyaml>=6.0",
	"ruff>=0.5",
	"types-python-dateutil",
	"types-pyyaml",
]

[project.scripts]
subroutine = "subroutine.cli.main:main"
# **A shorter name for the same program** (`#752`). Ten characters against sixteen, on a command
# somebody types dozens of times a day. Not a Typer command and not an alias inside the app —
# one entry point under two names, so there is nothing to keep in step and no second behaviour
# to choose between.
#
# **The `ls` precedent cuts the other way and that is deliberate.** `ls` is hidden from `--help`
# because a synonym a reader can *see* in a command list is a second thing to decide about. This
# is not in a command list: the choice is how much to type, not which command to run, and a
# reader who never meets it has lost nothing.
subr = "subroutine.cli.main:main"

[project.urls]
Homepage = "https://github.com/simonholliday/subroutine"
Issues = "https://github.com/simonholliday/subroutine/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/subroutine"]

[tool.mypy]
# The cache is a SQLite database. This working tree lives on a CIFS share where SQLite
# cannot take a lock, so the cache is kept on local disk. Harmless everywhere else, and
# it saves the next person a confusing INTERNAL ERROR.
cache_dir = "/tmp/subroutine-mypy-cache"
python_version = "3.11"
strict = true
warn_unreachable = true
warn_no_return = true
show_error_codes = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
module = ["uuid6.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
markers = [
	"postgres: test requires a live PostgreSQL server",
]
filterwarnings = ["error"]

[tool.coverage.run]
# The data file is a SQLite database, and this working tree lives on a CIFS share where
# SQLite cannot take a lock — so without this, `pytest --cov` does not degrade, it dies with
# `INTERNALERROR sqlite3.OperationalError: database is locked`. The same trap as `mypy`'s
# `cache_dir` above, and it meant the plan's >=90% coverage gate had never once been measured.
data_file = "/tmp/subroutine-coverage"
branch = true
source = ["subroutine"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if typing.TYPE_CHECKING:", "raise NotImplementedError"]

# Ruff is used as a LINTER ONLY. `ruff format` is never run: it would strip the
# space in `def foo (x)` and re-indent with spaces, both of which the house style
# requires the other way round. See CLAUDE.md.
[tool.ruff]
line-length = 100
indent-width = 4
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "RUF"]
ignore = [
	"E101",   # mixed indentation — tabs are the house standard
	"W191",   # tab indentation — likewise
	"E211",   # whitespace before parenthesis — `def foo (x)` is deliberate
	"E501",   # line length is enforced by review, not by a hard failure
	"SIM108", # ternaries are not always clearer than an if/else
]

[tool.ruff.lint.flake8-bugbear]
# Typer and FastAPI both declare an interface *in* the signature, so their constructors are
# the legitimate function calls in a default argument. B008 is right about the general case
# and wrong about these; naming them keeps the check on everywhere else.
#
# Without this the rule fires unevenly rather than consistently, which is worse than either:
# ruff exempts a default whose *annotation* is a builtin it knows to be immutable, so the
# same `fastapi.Query(None)` passes on `str | None` and fails on `uuid.UUID | None`. Measured,
# not assumed — the alternative reading was that ruff understood FastAPI, and it does not.
extend-immutable-calls = [
	"fastapi.Body",
	"fastapi.Header",
	"fastapi.Path",
	"fastapi.Query",
	"typer.Argument",
	"typer.Option",
]

[tool.ruff.lint.per-file-ignores]
# The models package imports its submodules purely so that Base.metadata is complete
# before Alembic or create_all runs. Nothing is re-exported, by design.
"src/subroutine/db/models/__init__.py" = ["F401"]
# Migration bodies are generated by Alembic: space-indented, `op.`-prefixed, and with
# whatever import order and trailing whitespace the generator produces. Reformatting
# them by hand on every autogenerate would be churn with no reader benefit.
# F401: the generation template always imports `subroutine.db.types`, because most
# migrations need it and a hand-edit per migration that does not is worse than the import.
"src/subroutine/db/migrations/versions/*.py" = ["I001", "W291", "W293", "E402", "F401"]

[tool.ruff.lint.isort]
known-first-party = ["subroutine"]
force-single-line = true

[tool.ruff.format]
# Present only to document that it is not used.
exclude = ["*"]
