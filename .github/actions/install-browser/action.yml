name: Install a browser
description: >
  Install Chromium and the system libraries it needs, bounded so that a stalled Ubuntu mirror
  cannot take the job with it.

# **One implementation, two callers** (`SR#1022`). Both `ci.yml` and `release.yml` need a
# browser, and the release one matters more — a hang there costs a version number. Two copies
# of this would be two copies of a rule that has to agree, which is this repository's own
# signature defect.

runs:
  using: composite

  steps:
    # **Split from the download so that a hang names which half** (`SR#1022`). Twice on
    # 2026-08-19, seven hours apart, this hung and took the job with it; both times the log
    # said the same thing and neither had been read:
    #
    #     15:51:13  playwright install --with-deps chromium
    #     15:51:51  Get:5 https://archive.ubuntu.com/ubuntu noble-security InRelease
    #     16:06:04  ##[error]The operation was canceled.
    #
    # Thirty-eight seconds in, `apt-get update` stalled on `archive.ubuntu.com` — after the
    # Azure mirror's entries came back `Ign:` — and said nothing for fourteen minutes. The
    # browser download never started. A single step could not have told anybody that.
    - name: Install the browser's system libraries
      shell: bash
      run: |
        # **apt's own timeouts, kept although they are not the fix.** `SR#1022` added these
        # after a 14m13s stall; `SR#1031` measured a 101-second gap with them in force, so apt
        # was trickling rather than idle and its timeout never fired. Harmless, and they still
        # bound the case where a connection genuinely dies.
        printf '%s\n' \
          'Acquire::http::Timeout "20";' \
          'Acquire::https::Timeout "20";' \
          'Acquire::Retries "2";' \
          | sudo tee /etc/apt/apt.conf.d/99-subroutine-timeouts > /dev/null

        # **A killed attempt leaves its apt behind, and that is what broke the retry**
        # (`SR#1031`). `playwright install-deps` runs apt under `sudo`, so `timeout` signals
        # *playwright* and the root-owned `apt-get` survives — an unprivileged process cannot
        # signal it. Attempt 2 then met `Could not get lock ... held by process 2350` and died
        # in one second, and so did attempt 3. Three attempts on paper, one in practice, and a
        # failure message claiming otherwise.
        #
        # So the cleanup is what makes a retry mean anything. Root, because what is being
        # killed is root's; `-x` matches the process *name* exactly, so it cannot match the
        # command doing the matching.
        clear_the_lock () {
          sudo pkill -9 -x apt-get || true
          sudo pkill -9 -x dpkg || true
          sudo rm -f /var/lib/apt/lists/lock /var/cache/apt/archives/lock \
            /var/lib/dpkg/lock /var/lib/dpkg/lock-frontend
          # An apt killed mid-transaction can leave dpkg half-configured, which fails every
          # later install with a different message than the one that caused it.
          sudo dpkg --configure -a || true
        }

        for attempt in 1 2; do
          if timeout 180 playwright install-deps chromium; then
            echo "installed the browser's system libraries on attempt ${attempt}"
            exit 0
          fi

          echo "::warning::the browser's system libraries did not install on attempt ${attempt}"
          clear_the_lock
        done

        # **This is a warning and not an error, which is the change `SR#1031` really makes.**
        # Nothing here cares whether `apt-get` succeeded; it cares whether Chromium launches,
        # and the suite is what answers that. Failing here asserts a *mechanism* where an
        # *outcome* is what matters — and it makes a mirror we do not own able to stop a build
        # that would otherwise have passed.
        #
        # **If anything is genuinely missing the next step still fails**, and it fails better:
        # Playwright names what it cannot find, where this said only that apt did not finish.
        #
        # **Re-measured on run 32308038524, and the old justification is dead**: this installs
        # nine *font* packages and no shared libraries at all, so *without it the browser
        # refuses to start* has stopped being true of `ubuntu-latest`. What is still at stake is
        # glyph coverage — and a missing font changes text *metrics*, which is what half of
        # `tests/test_browser.py` measures. That is why the step is kept and why failing on it
        # is not.
        echo "::warning::could not install the browser's system libraries — carrying on, because whether Chromium runs is what the suite is about (SR#1031)"

    # Its own step, so the annotation on a hang says *download* rather than *install*. This
    # half reaches Microsoft's CDN rather than Ubuntu's archive, and has never been the one
    # that stalled.
    - name: Download the browser
      shell: bash
      run: playwright install chromium
