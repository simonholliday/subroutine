name: Release

# Publishing is the one act here that cannot be undone: PyPI refuses a version it has already
# seen, even after a deletion, so a broken 0.1.0 is not fixed but abandoned. Everything in this
# file exists to spend that single attempt well — the suite runs, the metadata is checked, and
# the tag is made to agree with the version.
#
# **A failed upload spends nothing; only a successful upload of a bad artefact does.** That is
# why TestPyPI is a rehearsal somebody asks for rather than a gate on the way through. What it
# proves is the OIDC handshake, and if that is misconfigured the real upload simply fails and is
# retried; what it does not prove is the artefact, which `twine check` and a clean install from
# the built wheel already cover. Registering a publisher there is a separate account and a
# separate act, so a release must not wait on one.
#
# Hence: a **tag** publishes to PyPI, a **manual** run rehearses on TestPyPI, and neither can do
# the other's job by accident.
#
# No stored credential anywhere. Both uploads authenticate by OIDC against a trusted publisher
# (docs/design.md §2.2), which is why each publishing job asks for `id-token: write` and nothing else
# does.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # CI runs on pushes to main, and a tag is not one — so without this a release could publish
  # code no suite ever saw. One version rather than the full matrix: this is a gate on the
  # artefact, not the compatibility run that already happened on the commit.
  test:
    name: Tests
    runs-on: ubuntu-latest

    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          # Tags, because the version is derived from them (`SR#234`). A shallow clone makes
          # the build warn and produce `0.1.dev1+g…` rather than fail, so this job would
          # install a package quietly claiming to be a version nobody released.
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # **Node and a browser, because without them this job was not the gate it claims to be**
      # (`SR#927`'s H-17). CI splits these across two jobs to avoid downloading Chromium once
      # per Python version; there is one version here, so one job runs the lot.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: "22"

      - name: Install
        run: python -m pip install -e '.[dev,postgres]'

      # The system libraries Chromium needs on a bare runner, then the browser — bounded and
      # retried, because a stall here costs a version number (`SR#1022`).
      - uses: ./.github/actions/install-browser

      # **Serial, where CI and the local gate run this in parallel** (`SR#936`). This is the one
      # job that installs a browser *and* runs the whole suite in one command, so `-n` here
      # would put `tests/test_browser.py` under a distributed scheduler — measured on 8 cores,
      # that fails: `TimeoutError: Timeout 10000ms exceeded while waiting for event "page"`,
      # because a worker apiece launches its own Chromium. A release runs once and a flake here
      # costs a version number, so the twelve minutes are bought deliberately.
      #
      # Both backends, and an absent PostgreSQL, Node or browser is a failure rather than a
      # skip — a release verified on part of a test run is not verified.
      #
      # **Every release before this one published on a suite that never rendered the browser
      # app.** This job installed neither runtime and set only the PostgreSQL variable, so 198
      # tests in `test_web.py` and every one in `test_browser.py` skipped in silence and the
      # job went green. Adding the variables is half the fix; `tests/test_check_script.py`
      # derives the full set from the suite and fails when a workflow covers less than all of
      # it, because a list of what CI must set is a second copy of what the suite offers.
      - name: Tests on SQLite and PostgreSQL
        env:
          SUBROUTINE_TEST_POSTGRES_ADMIN_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
          SUBROUTINE_TEST_REQUIRE_POSTGRES: "1"
          SUBROUTINE_TEST_REQUIRE_NODE: "1"
          SUBROUTINE_TEST_REQUIRE_BROWSER: "1"
        run: pytest

  build:
    name: Build
    needs: test
    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:
      # Full history and tags: `check_release_notes.py` compares this commit's migration head
      # against the head at the previous tag, and a shallow clone has neither.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"

      # Subroutine itself as well as the build tools, because `check_release_notes.py` reads
      # the migration head through `subroutine.db.migrate` rather than by parsing files — the
      # asymmetry that script's own docstring argues for. Installing only `build` and `twine`
      # left it with `ModuleNotFoundError: No module named 'subroutine'`, which passed every
      # local check because a shell that can run the script already has the package (`SR#230`).
      - name: Install the build tools, and Subroutine itself
        run: python -m pip install -e . build twine

      - name: Build the wheel and the sdist
        run: python -m build

      - name: Check the metadata
        run: twine check dist/*

      # **Two things, and only the second can now be wrong** (`SR#234`). The package derives its
      # version from the tag, so the first comparison is close to tautological — it is kept
      # because it is not *quite* one: a shallow clone, a missing tag or a dirty tree all make
      # the backend produce a `.devN+g…` version instead, and this is where that would be caught
      # rather than at the upload. The plugin manifest is static JSON with no build step, so it
      # is the half that a release can genuinely publish out of step with itself.
      - name: The tag names what is being built and what the plugin claims
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          tagged="${GITHUB_REF_NAME#v}"

          built="$(python -c 'import importlib.metadata; print(importlib.metadata.version("subroutine"))')"
          if [ "$tagged" != "$built" ]; then
            echo "the tag $GITHUB_REF_NAME built version $built — expected $tagged" >&2
            exit 1
          fi

          declared="$(python -c 'import json, pathlib; print(json.loads(pathlib.Path("plugins/subroutine/.claude-plugin/plugin.json").read_text())["version"])')"
          if [ "$tagged" != "$declared" ]; then
            echo "the plugin manifest says $declared, and this release is $tagged" >&2
            exit 1
          fi

          echo "tag, package and plugin all agree on $tagged"

      # A release that moves the schema has to say so in the changelog (docs/design.md §12.4a). CI
      # checks this on every commit; it is checked again here because this is the run where
      # being wrong reaches somebody else's database.
      - name: Release notes
        run: python scripts/check_release_notes.py

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: dist
          path: dist/

  # The rehearsal: same artefacts, same mechanism, a registry where a mistake costs nothing —
  # run when somebody asks for it. Skipped entirely on a tag, so a release is never held up for
  # the want of a publisher registered on a different site.
  testpypi:
    name: TestPyPI
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    # Generous, because these two reach an index we do not run. `timeout-minutes` bounds the
    # job once it is *running*, so an environment waiting on a human is not counted against it.
    timeout-minutes: 20

    environment:
      name: testpypi
      url: https://test.pypi.org/p/subroutine

    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/

  # `push` can only mean a tag here, since that is this workflow's only push trigger — so the
  # condition says "a release, not a rehearsal" rather than restating the trigger.
  #
  # **The `pypi` environment is where the trusted publisher is scoped, not a gate** (`SR#814`).
  # It is what lets the OIDC exchange below authenticate with no stored credential, and it puts
  # the deployment URL on the run. A GitHub environment *can* carry a required reviewer, and
  # this one does not — so **pushing the tag is what publishes**, unattended, minutes later.
  #
  # This comment used to say a reviewer made the upload "a decision somebody takes rather than a
  # consequence of pushing a tag", and `#242`'s step 5 said so outright. Neither was true, and
  # the property they promised is the one a person leans on: that a tag can be pushed and then
  # reconsidered. **The last reversible moment is before `git push origin vX.Y.Z`**, because
  # PyPI burns a version the moment it accepts one and refuses a re-upload for ever after.
  #
  # Adding a reviewer to the environment is a settings change, not a change here — which is also
  # why no file in this repository can check this and no test can reach it.
  pypi:
    name: PyPI
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    timeout-minutes: 20

    environment:
      name: pypi
      url: https://pypi.org/p/subroutine

    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2

  # **After PyPI, never beside it** (`SR#241`). A GitHub release is an announcement, and one
  # announcing a version the index does not have sends people to an install that fails. So this
  # needs `pypi`, which means a failed upload leaves no release to explain away.
  #
  # The notes are the changelog section for this tag rather than a list of commit subjects,
  # because two accounts of one release drift the moment anybody edits either — and
  # `release_notes.py` exits non-zero on a missing or empty section, so what would otherwise be
  # a silent failure (a release page saying nothing at all) fails the job instead.
  announce:
    name: GitHub release
    needs: pypi
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    timeout-minutes: 15

    # The only job here that writes anything back to the repository, which is why the file
    # declares `contents: read` at the top and this one widens it for itself alone.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: dist
          path: dist/

      # The wheel and the sdist go up with it: the same files PyPI got, reachable by somebody
      # who cannot use an index, and a second place to check a release against.
      - name: Publish the release, with the changelog as its notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          python scripts/release_notes.py "$version" > /tmp/notes.md
          gh release create "$GITHUB_REF_NAME" \
            --title "Subroutine $version" \
            --notes-file /tmp/notes.md \
            dist/*
