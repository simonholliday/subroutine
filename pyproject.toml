[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "subroutine"
version = "0.1.0"
description = "Project management for people and agents, in equal measure."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Simon Holliday", email = "simon.holliday@protonmail.com" }]
keywords = ["project-management", "tasks", "agents", "ai", "self-hosted", "cli"]
classifiers = [
	"Development Status :: 3 - Alpha",
	"Environment :: Console",
	"Framework :: FastAPI",
	"Intended Audience :: Developers",
	"Operating System :: OS Independent",
	"Programming Language :: Python :: 3.11",
	"Programming Language :: Python :: 3.12",
	"Programming Language :: Python :: 3.13",
	"Topic :: Office/Business :: Scheduling",
	"Typing :: Typed",
]

dependencies = [
	"alembic>=1.13",
	"argon2-cffi>=23.1",
	"dateparser>=1.2",
	"fastapi>=0.115",
	"httpx>=0.27",
	"pydantic>=2.7",
	"pydantic-settings>=2.3",
	"python-dateutil>=2.9",
	"rich>=13.7",
	"sqlalchemy>=2.0.30",
	"typer>=0.12",
	"tzdata>=2024.1",
	"uuid6>=2024.7",
	"uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = [
	"hypothesis>=6.100",
	"mypy>=1.10",
	"pytest>=8.2",
	"pytest-cov>=5.0",
	"ruff>=0.5",
	"types-dateparser",
	"types-python-dateutil",
]

[project.scripts]
subroutine = "subroutine.cli.main:main"

[project.urls]
Homepage = "https://github.com/simonholliday/subroutine"
Documentation = "https://github.com/simonholliday/subroutine/blob/main/SPEC.md"
Issues = "https://github.com/simonholliday/subroutine/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/subroutine"]

[tool.mypy]
# The cache is a SQLite database. This working tree lives on a CIFS share where SQLite
# cannot take a lock, so the cache is kept on local disk. Harmless everywhere else, and
# it saves the next person a confusing INTERNAL ERROR.
cache_dir = "/tmp/subroutine-mypy-cache"
python_version = "3.11"
strict = true
warn_unreachable = true
warn_no_return = true
show_error_codes = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["dateparser.*", "uuid6.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
markers = [
	"postgres: test requires a live PostgreSQL server",
]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["subroutine"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if typing.TYPE_CHECKING:", "raise NotImplementedError"]

# Ruff is used as a LINTER ONLY. `ruff format` is never run: it would strip the
# space in `def foo (x)` and re-indent with spaces, both of which the house style
# requires the other way round. See CLAUDE.md.
[tool.ruff]
line-length = 100
indent-width = 4
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "RUF"]
ignore = [
	"E101",   # mixed indentation — tabs are the house standard
	"W191",   # tab indentation — likewise
	"E211",   # whitespace before parenthesis — `def foo (x)` is deliberate
	"E501",   # line length is enforced by review, not by a hard failure
	"SIM108", # ternaries are not always clearer than an if/else
]

[tool.ruff.lint.per-file-ignores]
# The models package imports its submodules purely so that Base.metadata is complete
# before Alembic or create_all runs. Nothing is re-exported, by design.
"src/subroutine/db/models/__init__.py" = ["F401"]
# Migration bodies are generated by Alembic: space-indented, `op.`-prefixed, and with
# whatever import order and trailing whitespace the generator produces. Reformatting
# them by hand on every autogenerate would be churn with no reader benefit.
"src/subroutine/db/migrations/versions/*.py" = ["I001", "W291", "W293", "E402"]

[tool.ruff.lint.isort]
known-first-party = ["subroutine"]
force-single-line = true

[tool.ruff.format]
# Present only to document that it is not used.
exclude = ["*"]
